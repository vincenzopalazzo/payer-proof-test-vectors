[workspace]
resolver = "2"
members = ["crates/bolt12-payer-proof", "cli"]

# Shared LDK dependency — pinned to the v0.3.0-beta1 tag that shipped the
# payer-proof primitives.  Using workspace-level deps so both crates resolve to
# the exact same revision.
[workspace.dependencies]
lightning = { git = "https://github.com/lightningdevkit/rust-lightning", tag = "v0.3.0-beta1" }
lightning-types = { git = "https://github.com/lightningdevkit/rust-lightning", tag = "v0.3.0-beta1" }
