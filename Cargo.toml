[package]
name = "payer-proof-test-vectors"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bitcoin = { version = "0.32", features = ["serde"] }
thiserror = "2.0"

# Use the rust-lightning fork with payer proof implementation
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", branch = "macros/proof-of-payment-bolt12-spec", package = "lightning" }
lightning-types = { git = "https://github.com/vincenzopalazzo/rust-lightning", branch = "macros/proof-of-payment-bolt12-spec", package = "lightning-types" }

# For deterministic key generation in test vectors
rand = "0.8"
rand_chacha = "0.3"
