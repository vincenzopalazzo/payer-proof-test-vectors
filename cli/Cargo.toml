[package]
name = "payer-proof-test-vectors"
version = "0.1.0"
edition = "2021"
description = "CLI tool for generating and verifying BOLT 12 payer proof test vectors"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bitcoin = { version = "0.32", features = ["serde"] }
thiserror = "2.0"

lightning = { workspace = true }
lightning-types = { workspace = true }

# For deterministic key generation in test vectors
rand = "0.8"
rand_chacha = "0.3"

# Internal library for verification
bolt12-payer-proof = { path = "../crates/bolt12-payer-proof" }
